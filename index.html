<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sparsh Arthroplasty Registry</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&family=Noto+Sans+Kannada:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Layout: mobile-first single column; patient list widens to two columns on larger screens. */
:root{
  /* Sparsh brand book 2024 */
  --bg:#f4f8fc; --card:#ffffff; --ink:#0b1a2e; --muted:#4d5f75; --line:#d3e1ee;
  --blue:#0E4D9B; --blue-ink:#ffffff; --blue-soft:#e3f3fc;
  --orange:#BD202F; --green:#0E4D9B; --green-soft:#C6EAFA; --amber:#BD202F; --amber-soft:#FFDFCA;
  --red:#BD202F; --red-soft:#FFDFCA;
  --yellow:#FEC212;
  --radio:#FFDFCA; --radio-line:#efbf9f; --radio-ink:#8f1420;
  --prom:#FFF4CF; --prom-line:#ecd486; --prom-ink:#6e4c00;
  --clin:#C6EAFA; --clin-line:#97cde9; --clin-ink:#0E4D9B;
  --font:"Avenir Next",Avenir,"Nunito Sans","Segoe UI",system-ui,sans-serif;
  --head:"EB Garamond",Garamond,Georgia,serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.35;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}

.topbar{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:3px solid var(--yellow);box-shadow:0 1px 0 var(--blue);padding:8px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;background:none;border:0;padding:0;text-align:left}
.logo{display:block;height:44px;width:auto}
.logo.xl{height:72px;margin:0 auto}
.regname{font-family:var(--head);font-weight:600;color:var(--red);font-size:17px;line-height:1.1;padding-left:10px;border-left:2px solid var(--line)}
@media (max-width:560px){.regname{display:none}}
.kn{font-weight:700}
.kn .a{color:var(--blue)}.kn .b{color:var(--red)}
.foot{max-width:1080px;margin:0 auto;padding:8px 16px 32px;text-align:center;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.foot a{color:var(--blue);font-weight:700}
.iconbtn{background:none;border:1px solid var(--line);border-radius:8px;width:36px;height:36px;display:grid;place-items:center;font-size:20px;line-height:1}
.toplinks{display:flex;align-items:center;gap:8px}
.linkbtn{background:none;border:0;color:var(--blue);font-weight:600;padding:8px}

.wrap{max-width:1080px;margin:0 auto;padding:16px;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.narrow{max-width:640px}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}
h1,h2,h3{font-family:var(--head);color:var(--blue);font-weight:600}
h1{font-size:28px}h2{font-size:22px}h3{font-size:19px}
.muted{color:var(--muted);font-size:14px}
.eyebrow{font-size:12px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--muted)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.stat b{display:block;font-size:30px;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:11px 16px;font-weight:600;min-height:44px}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.btn.outline{border-color:var(--blue);color:var(--blue)}
.btn:disabled{opacity:.5;cursor:default}
.search{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--card)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:12px}
.pcard{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.pcard .uhid{font-weight:700;font-size:17px;overflow-wrap:anywhere}
.sid{color:var(--orange);font-weight:600;font-size:13px}
.chip{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:6px;background:var(--blue-soft);color:var(--blue);align-self:flex-start}
.chip.green{background:var(--green-soft);color:var(--green)}
.chip.amber{background:var(--amber-soft);color:var(--amber)}
.chip.grey{background:#eceff4;color:#475467}
.pcard .go{align-self:flex-end;color:var(--blue);font-weight:600;margin-top:4px}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lbl{font-weight:600;font-size:15px}
.req{color:var(--red)}
.hint{font-size:13px;color:var(--muted)}
.err{font-size:13px;color:var(--red);font-weight:600}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=password],select,textarea{width:100%;border:1px solid #c9cfdb;border-radius:10px;padding:11px 12px;background:#fff;min-height:44px}
textarea{min-height:100px;resize:vertical}
input.bad,select.bad,textarea.bad{border-color:var(--red)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.two{grid-template-columns:1fr}}
.note{background:#f4f6fa;border-radius:8px;padding:10px 12px;font-size:13px;color:var(--muted)}
.chips{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;min-height:44px}
.opt input{width:20px;height:20px;margin:1px 0 0;flex:none;accent-color:var(--blue)}
.opt.on{border-color:var(--blue);background:var(--blue-soft)}
.group{border:0;margin:0;padding:0;min-width:0}
.group>legend{font-weight:600;font-size:15px;padding:0;margin-bottom:8px}
.sect{border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line);background:var(--card)}
.sect.radio{background:var(--radio);border-color:var(--radio-line)}
.sect.clin{background:var(--clin);border-color:var(--clin-line)}
.sect.prom{background:var(--prom);border-color:var(--prom-line)}
.sect.prom .tag{color:var(--prom-ink)}
.sect .tag{font-size:12px;letter-spacing:.08em;font-weight:800;text-transform:uppercase}
.sect.radio .tag{color:var(--radio-ink)}
.sect.clin .tag{color:var(--clin-ink)}
.sect.radio .hint,.sect.clin .hint,.sect.prom .hint{color:#4a5565}
.formnav{display:flex;gap:10px;position:sticky;bottom:0;background:linear-gradient(to top,var(--bg) 70%,rgba(244,248,252,0));padding:16px 0 calc(8px + env(safe-area-inset-bottom,0px))}
.formnav .btn{flex:1}
.stepbadge{display:inline-block;background:var(--green-soft);color:var(--green);font-weight:800;font-size:12px;letter-spacing:.05em;padding:4px 10px;border-radius:6px;text-transform:uppercase}

/* score tiles */
.scorebtn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:#fff;border:1px dashed var(--blue);border-radius:10px;padding:12px 14px;min-height:56px}
.scorebtn.done{border-style:solid}
.scorebtn .sv{font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.scorebtn .sb{font-size:13px;color:var(--muted)}
.scorebtn .go{color:var(--blue);font-weight:700;font-size:14px;white-space:nowrap}
.scorebtn .empty{color:var(--blue);font-weight:700}

/* CPAK */
.cpak{display:grid;grid-template-columns:28px repeat(3,minmax(0,1fr));gap:6px;align-items:stretch}
.cpak .ax{font-size:11px;font-weight:700;color:var(--muted);text-align:center;display:grid;place-items:center;line-height:1.15}
.cpak .axv{writing-mode:vertical-rl;transform:rotate(180deg)}
.cpak-cell{background:#fff;border:2px solid var(--line);border-radius:10px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:0;min-height:86px}
.cpak-cell img{width:100%;max-width:100px;height:auto;mix-blend-mode:multiply;display:block}

.cpak-cell.sel{border-color:var(--blue);background:var(--blue-soft)}
.cpak-cell.sug{border-style:dashed;border-color:var(--blue)}
.suggest{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* patient timeline */
.tl{display:flex;justify-content:space-between;align-items:center;gap:12px}
.tl .t{min-width:0}
.tick{color:var(--green);font-weight:700;font-size:13px}

/* modal / sheet */
.overlay{position:fixed;inset:0;background:rgba(16,24,40,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:640px){.overlay{align-items:center}.sheet{border-radius:16px}}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue)}
.answer{width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;min-height:50px;font-weight:500}
.answer.sel{background:var(--blue-soft);border-color:var(--blue)}
.big{font-size:52px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;text-align:center}
.big small{font-size:20px;color:var(--muted);font-weight:500}
.band{display:inline-block;padding:4px 12px;border-radius:999px;font-weight:700;font-size:14px;border:1px solid currentColor}
.good{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}
table.ans{width:100%;border-collapse:collapse;font-size:14px}
table.ans td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.ans td:last-child{text-align:right;font-weight:700;padding-left:10px;white-space:nowrap}
.plist{display:flex;flex-direction:column;gap:8px;max-height:50vh;overflow:auto}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:#101828;color:#fff;padding:12px 18px;border-radius:10px;z-index:80;font-weight:600;max-width:90vw;text-align:center}
.center{text-align:center}
.figf{display:grid;grid-template-columns:minmax(0,1fr) 104px;gap:12px;align-items:start}
.figf>.field{min-width:0}
.fig{display:flex;flex-direction:column;gap:4px;align-items:center;font-size:11px;line-height:1.2;color:var(--muted);text-align:center}
.fig svg{width:104px;height:104px;background:#fff;border:1px solid var(--line);border-radius:8px}
.imgs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.th{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#0b1a2e}
.th .vw{display:block;width:100%;height:100%;padding:0;border:0;background:none}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .rm{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(11,26,46,.75);color:#fff;font-size:18px;line-height:1}
.imgbtns{display:flex;gap:8px}
.imgbtns .btn{flex:1;display:grid;place-items:center;text-align:center;cursor:pointer}
.imgbtns .btn.dis{opacity:.45;pointer-events:none}
.imgbtns input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.fig img{width:124px;height:auto;background:#fff;border:1px solid var(--line);border-radius:8px}
.figf.grp{grid-template-columns:minmax(0,1fr) 124px}
.hkaf{display:grid;grid-template-columns:190px minmax(0,1fr);gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px}
.hkaf svg{width:190px;height:auto;display:block}
.hkaf ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:12px;line-height:1.25;color:var(--ink)}
.hkaf li b{color:var(--red)}
.hkaf.stk{grid-template-columns:1fr}
.twoimg{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:420px;margin:0 auto}
.twoimg figure{margin:0;text-align:center;font-size:11px;color:var(--muted)}
.twoimg img{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:8px;background:#fff}
.twoimg.three{grid-template-columns:1fr 1fr 1fr;max-width:540px}
.bigimg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto;border-radius:8px;background:#fff}
.hkaf.stk svg{width:100%;max-width:340px;margin:0 auto}
.mcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:14px}
.mcard .hkaf{border:0;padding:0 0 12px;border-bottom:1px dashed var(--line);border-radius:0;gap:10px}
.mcard .bigimg,.mcard .twoimg{max-width:340px}
.mcard .hkaf ul{font-size:12.5px}
.hkaf .cap{font-size:11px;color:var(--muted)}
.viewer{align-items:center}
.viewer img{max-width:100%;max-height:70vh;border-radius:8px}
.jrow{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;background:#fff}
.jh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.jl{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.sidehd{font-weight:700;color:var(--blue);border-bottom:2px solid var(--blue);padding:6px 0 3px;margin-top:6px;letter-spacing:.02em}
.direct{font-size:13px;color:inherit;opacity:.85;margin-top:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.sts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.stt{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:6px}
.st-c{background:#D5EBDA;color:#2f6d3d}.st-p{background:#FFE9A8;color:#6b4e00}.st-n{background:#eceff4;color:#475467}
.card.tl.part{background:#FFF7DD;border-left:4px solid #FEC212}
.card.tl.done{background:#E8F3E8;border-left:4px solid #3E8E50}
.prefilled{display:flex;flex-direction:column;gap:14px;background:#E8F3E8;border-left:4px solid #3E8E50;border-radius:8px;padding:10px}
.sidehd.pfh{background:#E8F3E8;border-bottom-color:#3E8E50;padding-left:8px;display:flex;justify-content:space-between;gap:8px}
.pfnote{font-weight:600;font-size:12px;color:#2f6d3d}
.dwrap{position:relative;display:flex;gap:8px;align-items:stretch}
.dwrap input[type=text]{flex:1;min-width:0}
.calbtn{flex:none;width:46px;display:grid;place-items:center;background:#fff;border:1px solid var(--blue);color:var(--blue);border-radius:10px}
.dnat{position:absolute;right:0;top:0;width:46px;height:100%;opacity:0;pointer-events:none;border:0;padding:0}
.calhead{display:grid;grid-template-columns:44px 1fr 90px 44px;gap:6px;align-items:center}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cwk{font-weight:700;color:var(--muted);text-align:center;font-size:13px}
.cday{padding:11px 0;border-radius:8px;border:1px solid transparent;background:#fff;font-weight:600}
.cday.tod{border-color:var(--blue)}
.cday.sel{background:var(--blue);color:#fff}
.cday:disabled{opacity:.3}
#printout{display:none}
@media print{
  body > *:not(#printout){display:none !important}
  #printout{display:block;color:#000;font:12px/1.35 Arial,sans-serif}
  @page{margin:14mm 12mm}
}
#printout h1{font-size:18px;margin:0 0 2px}
#printout h2{font-size:14px;margin:14px 0 4px;padding:3px 6px;background:#e8eef7;break-after:avoid}
#printout h3{font-size:12px;margin:8px 0 2px;color:#333;break-after:avoid}
#printout .pside{font-weight:700;margin:6px 0 2px;text-decoration:underline}
#printout table{width:100%;border-collapse:collapse}
#printout td{border-bottom:1px solid #ddd;padding:2px 4px;vertical-align:top}
#printout td:first-child{width:45%;color:#333}
#printout .pmeta{color:#444;margin:0 0 6px}
#printout .pfoot{margin-top:14px;color:#666;font-size:10px}
</style>
</head>

<div id="app"></div>

<div id="printout"></div>
<div id="toast" hidden></div>

const mem = {};
const IMG = {}; let idb = null;
function idbOpen(){ return new Promise(res => { try{ const r = indexedDB.open("sparsh_registry_img", 1); r.onupgradeneeded = () => r.result.createObjectStore("i"); r.onsuccess = () => res(r.result); r.onerror = r.onblocked = () => res(null); }catch(e){ res(null); } }); }
async function idbLoad(){ idb = await idbOpen(); if(!idb) return; await new Promise(res => { try{ const rq = idb.transaction("i").objectStore("i").openCursor(); rq.onsuccess = () => { const c = rq.result; if(c){ IMG[c.key] = c.value; c.continue(); } else res(); }; rq.onerror = () => res(); }catch(e){ res(); } }); }
function idbPut(id, d){ if(!idb) return false; try{ idb.transaction("i", "readwrite").objectStore("i").put(d, id); return true; }catch(e){ return false; } }
function shrink(file){ return new Promise((res, rej) => { const u = URL.createObjectURL(file), im = new Image(); im.onload = () => { const m = 1280, k = Math.min(1, m / Math.max(im.width, im.height)), c = document.createElement("canvas"); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(u); res(c.toDataURL("image/jpeg", .72)); }; im.onerror = () => { URL.revokeObjectURL(u); rej(new Error("bad image")); }; im.src = u; }); }

const romPts = t => t >= 211 ? 5 : t >= 161 ? 4 : t >= 101 ? 3 : t >= 61 ? 2 : t >= 31 ? 1 : 0;
function itemPts(it, a){
  if(a == null) return null;
  if(it.type === "checks") return a.some(Boolean) ? 0 : 4;
  if(it.type === "rom") return romPts(a.reduce((s, v) => s + (+v || 0), 0));
  return it.opts[a][1];
}
function itemText(it, a){
  if(it.type === "checks"){ const p = it.checks.filter((_, i) => a[i]); return p.length ? p.join("; ") : "None present"; }
  if(it.type === "rom") return "Total arc " + a.reduce((s, v) => s + (+v || 0), 0) + "°";
  return it.opts[a][0];
}
function scoreResult(key, ans){
  const sc = SCORES[key];
  const raw = sc.items.reduce((s, it, i) => s + itemPts(it, ans[i]), 0);
  if(key === "koos"){
    const conv = KOOSPS_TABLE.length === 29 ? KOOSPS_TABLE[raw] : null;
    return { total: raw, band: conv != null ? "0-100 score: " + conv.toFixed(1) : "Raw total. 0-100 conversion not loaded yet", cls: "" };
  }
  if(key === "hhs"){
    const b = raw >= 90 ? ["Excellent","good"] : raw >= 80 ? ["Good","good"] : raw >= 70 ? ["Fair","warn"] : ["Poor","bad"];
    return { total: raw, band: b[0], cls: b[1] };
  }
  const b = raw >= 40 ? ["Satisfactory function","good"] : raw >= 30 ? ["Mild to moderate","warn"] : raw >= 20 ? ["Moderate to severe","warn"] : ["Severe","bad"];
  return { total: raw, band: b[0], cls: b[1] };
}

const SL = j => j.side[0];

const jlab = j => j.side + " " + j.joint;
function stripV(v, S){
  const o = {};
  Object.keys(v).forEach(k => { if(!/__[RL](__ans)?$/.test(k)) o[k] = v[k]; });
  Object.keys(v).forEach(k => { const m = /^(.*)__([RL])(__ans)?$/.exec(k); if(m && m[2] === S) o[m[1] + (m[3] || "")] = v[k]; });
  return o;
}
function sfxField(fd, S, gate){
  const g = Object.assign({}, fd), st = v => stripV(v, S);
  if(fd.n) g.n = fd.n + "__" + S;
  if(fd.mldfa){ g.mldfa = fd.mldfa + "__" + S; g.mpta = fd.mpta + "__" + S; }
  const si = fd.showIf;
  if(si || gate) g.showIf = v => (!gate || gate(v)) && (!si || si(st(v)));
  if(typeof fd.o === "function") g.o = v => fd.o(st(v));
  if(typeof fd.hint === "function") g.hint = v => fd.hint(st(v));
  if(fd.fn) g.fn = (v, c) => fd.fn(st(v), c, S);
  return g;
}
const SHARED_T = ["figure","guide","ref"];
function mergeSec(J, mk, gate){
  const first = mk(J[0]), fields = [];
  const many = J.length > 1 || (ui.ctx && ui.ctx.patient && ui.ctx.patient.joints.length > 1);
  const pf = ui.form && ui.form.prefilled && J.length > 1 ? ui.form.prefilled : null;
  J.forEach((j, i) => {
    const sec = i === 0 ? first : mk(j), done = !!(pf && pf[SL(j)]);
    if(many) fields.push({ t:"label", side:true, l:sideLab(j), showIf:gate, pf:done });
    sec.fields.forEach(fd => { if(SHARED_T.includes(fd.t)){ if(i === 0) fields.push(fd); } else { const g = sfxField(fd, SL(j), gate); g.pf = done; fields.push(g); } });
  });
  return Object.assign({}, first, { fields });
}
function promFor(pt, p){
  const J = pt.joints, same = J.every(j => j.joint === J[0].joint);
  if(same){ const sc = promSection(p, J[0].joint); if(J.length > 1) sc.desc = "One set of scores for the patient, covering both " + (J[0].joint === "TKA" ? "knees" : "hips") + ". Tap a score to open its questionnaire."; return sc; }
  return mergeSec(J, j => promSection(p, j.joint));
}

/* ----- one patient's full record as a printable page: the browser's print dialog saves it as a PDF on this device, nothing is uploaded ----- */
function pdfVal(fd, v){
  const x = v[fd.n];
  if(fd.t === "images") return Array.isArray(x) && x.length ? x.length + " image" + (x.length > 1 ? "s" : "") + " attached (not included)" : "";
  if(x === undefined || x === null || x === "" || (Array.isArray(x) && !x.length)) return "";
  if(fd.t === "date") return fmtD(x);
  if(fd.t === "cpak") return "Type " + x;
  if(fd.t === "score"){ const ans = v[fd.n + "__ans"], sc = SCORES[fd.calc]; return x + " / " + sc.max + (Array.isArray(ans) ? " (" + scoreResult(fd.calc, ans).band + ")" : ""); }
  if(fd.t === "select"){ const o = (typeof fd.o === "function" ? fd.o(v) : fd.o).find(o => Array.isArray(o) && o[0] === x); return o ? o[1] : String(x); }

}

function validateStep(schema, stepIdx){

    }

    if(fd.t === "score" && val !== undefined && val !== ""){ const mx = SCORES[fd.calc].max, x = Number(val); if(isNaN(x) || x < 0 || x > mx || Math.floor(x) !== x) e[fd.n] = "Enter a whole number from 0 to " + mx + "."; }

    else {

      const o = J[1];

/* ---------- SharePoint sync ---------- */
function spLoadScript(src){ return new Promise((res, rej) => { const el = document.createElement("script"); el.src = src; el.onload = res; el.onerror = () => rej(new Error("Could not load the Microsoft sign-in library")); document.head.appendChild(el); }); }
async function spInit(){
  await spLoadScript("https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.28.1/lib/msal-browser.min.js");
  const ru = location.origin + location.pathname.replace(/index\.html$/, "");
  SP.pca = new msal.PublicClientApplication({ auth:{ clientId:SPC.client, authority:"https://login.microsoftonline.com/" + SPC.tenant, redirectUri:ru, postLogoutRedirectUri:ru }, cache:{ cacheLocation:"localStorage" } });
  await SP.pca.initialize();
  const r = await SP.pca.handleRedirectPromise();
  SP.acct = (r && r.account) || SP.pca.getAllAccounts()[0] || null;
  if(SP.acct) SP.pca.setActiveAccount(SP.acct);
}
async function spToken(){
  try{ return (await SP.pca.acquireTokenSilent({ scopes:SPC.scopes, account:SP.acct })).accessToken; }
  catch(e){ await SP.pca.acquireTokenRedirect({ scopes:SPC.scopes, account:SP.acct }); throw new Error("redirecting"); }
}
async function spFetch(path, opt){
  const t = await spToken(), o = opt || {};
  const r = await fetch(path.indexOf("http") === 0 ? path : "https://graph.microsoft.com/v1.0" + path, Object.assign({}, o, { headers:Object.assign({ Authorization:"Bearer " + t, "Content-Type":"application/json" }, o.headers || {}) }));
  if(r.status === 204) return null;
  const j = await r.json().catch(() => ({}));
  if(!r.ok) throw new Error((j.error && j.error.message) || ("HTTP " + r.status));
  return j;
}
async function spLocate(){
  const st = await spFetch("/sites/" + SPC.host + ":" + SPC.site); SP.siteId = st.id;
  const l = await spFetch("/sites/" + SP.siteId + "/lists?$filter=displayName eq '" + SPC.list + "'&$select=id,displayName");
  if(!l.value || !l.value.length) throw new Error('SharePoint list "' + SPC.list + '" was not found');
  SP.listId = l.value[0].id;
  try{ SP.driveUrl = (await spFetch("/sites/" + SP.siteId + "/drive?$select=webUrl")).webUrl; }catch(e){}
}
// X-rays are saved as files in the site's Documents library: Registry X-rays/<UHID>/<image id>.jpg
const XR_DIR = "Registry X-rays";
const xrPath = (uhid, id) => [XR_DIR, uhid, id + ".jpg"].map(encodeURIComponent).join("/");
const xrUrl = (uhid, id) => SP.driveUrl ? SP.driveUrl + "/" + xrPath(uhid, id) : "";
const xrIds = r => { const out = []; Object.values((r && r.values) || {}).forEach(v => { if(Array.isArray(v)) v.forEach(x => { if(typeof x === "string" && x.indexOf("img_") === 0) out.push(x); }); }); return out; };
const XR_UP = new Set(ls.get("sparsh_xr_up", []));
function xrPending(){ const out = []; Object.keys(forms).forEach(k => { const r = forms[k]; xrIds(r).forEach(id => { if(IMG[id] && !XR_UP.has(id)) out.push([r.patientId || k.split("_")[0], id]); }); }); return out; }
// Upload this device's X-rays before the forms that refer to them are saved
async function xrUpload(){
  for(const [uhid, id] of xrPending()){
    const blob = await (await fetch(IMG[id])).blob();
    await spFetch("/sites/" + SP.siteId + "/drive/root:/" + xrPath(uhid, id) + ":/content", { method:"PUT", body:blob, headers:{ "Content-Type":"image/jpeg" } });
    XR_UP.add(id); ls.set("sparsh_xr_up", Array.from(XR_UP));
  }
}
// Fetch an X-ray taken on another device; true while it is loading
const XR_GET = {};
function xrGet(uhid, id){
  if(!SP.on || !SP.siteId || !uhid || IMG[id]) return false;
  if(XR_GET[id]) return XR_GET[id] === 1;
  XR_GET[id] = 1;
  spFetch("/sites/" + SP.siteId + "/drive/root:/" + xrPath(uhid, id))
    .then(j => fetch(j["@microsoft.graph.downloadUrl"])).then(r => r.blob())
    .then(b => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(b); }))
    .then(d => { IMG[id] = d; idbPut(id, d); XR_UP.add(id); XR_GET[id] = 2; if(ui.form){ const y = window.scrollY; drawForm(); window.scrollTo(0, y); } })
    .catch(() => { XR_GET[id] = 3; });
  return true;
}
const SP_PREFER = { Prefer:"HonorNonIndexedQueriesWarningMayFailRandomly" };
function spTake(it){
  const f = it.fields || {}; let o; try{ o = JSON.parse(f.Payload || ""); }catch(e){ return null; }
  if(f.Kind === "Patient"){ SP.snap["P|" + o.id] = { id:it.id, s:f.Payload }; return { k:"P", o }; }
  if(f.Kind === "Form"){ SP.snap["F|" + f.Title] = { id:it.id, s:f.Payload }; return { k:"F", t:f.Title, o }; }
  return null;
}
// Patients load up front; each patient's forms load when that patient is opened
async function spLoad(){
  const base = "/sites/" + SP.siteId + "/lists/" + SP.listId + "/items?$expand=fields($select=Title,Kind,Payload)&$select=id&$top=999";
  const P = []; SP.snap = {}; SP.fl = new Set(); forms = {};
  let url = base + "&$filter=fields/Kind eq 'Patient'", lazyOk = true;
  try{
    while(url){ const j = await spFetch(url, { headers:SP_PREFER }); (j.value || []).forEach(it => { const r = spTake(it); if(r && r.k === "P") P.push(r.o); }); url = j["@odata.nextLink"]; }
  }catch(e){ lazyOk = false; }
  if(!lazyOk || P.some(p => !p.sum)){
    // older entries without a summary, or filtering unavailable: load everything once
    P.length = 0; SP.snap = {}; url = base;
    while(url){ const j = await spFetch(url); (j.value || []).forEach(it => { const r = spTake(it); if(!r) return; if(r.k === "P") P.push(r.o); else forms[r.t] = r.o; }); url = j["@odata.nextLink"]; }
    P.forEach(p => SP.fl.add(p.id));
  }
  P.sort((a, b) => String(b.createdAt || "").localeCompare(String(a.createdAt || "")));
  patients = P;
}
async function spLoadForms(pid){
  let url = "/sites/" + SP.siteId + "/lists/" + SP.listId + "/items?$expand=fields($select=Title,Kind,Payload)&$select=id&$top=999&$filter=fields/UHID eq '" + pid + "' and fields/Kind eq 'Form'";
  while(url){ const j = await spFetch(url, { headers:SP_PREFER }); (j.value || []).forEach(it => { const r = spTake(it); if(r && r.k === "F") forms[r.t] = r.o; }); url = j["@odata.nextLink"]; }
  SP.fl.add(pid);
  if(xrPending().length) spQueue();
}
function spStatus(k, extra){
  let el = document.getElementById("spst");
  if(!el){ el = document.createElement("div"); el.id = "spst"; el.setAttribute("role", "status"); el.style.cssText = "position:fixed;left:10px;bottom:84px;z-index:30;font:700 11px 'Nunito Sans',sans-serif;padding:5px 10px;border-radius:99px;background:#fff;border:1px solid #d9dfe8;box-shadow:0 1px 4px rgba(0,0,0,.12);max-width:80vw"; document.body.appendChild(el); }
  const m = { pending:["Unsaved changes", "#8a6d00"], saving:["Saving to SharePoint…" + (extra ? " " + extra : ""), "#0E4D9B"], saved:["Saved to SharePoint ✓", "#1b7a3a"], error:["Not saved yet, retrying: " + SP.err, "#BD202F"] }[k];
  el.textContent = m[0]; el.style.color = m[1];
}
// Send changes 20 at a time through Graph $batch; throttled requests wait and retry
async function spRun(ops){
  for(let i = 0; i < ops.length; i += 20){
    let chunk = ops.slice(i, i + 20), tries = 0;
    if(ops.length > 20) spStatus("saving", Math.min(i + 20, ops.length) + " of " + ops.length);
    while(chunk.length){
      const j = await spFetch("/$batch", { method:"POST", body:JSON.stringify({ requests:chunk.map((o, n) => ({ id:String(n), method:o.method, url:o.url, headers:{ "Content-Type":"application/json" }, body:o.body })) }) });
      const res = {}; (j.responses || []).forEach(r => { res[r.id] = r; });
      const again = []; let wait = 0;
      chunk.forEach((o, n) => { const r = res[String(n)] || { status:0 };
        if(r.status >= 200 && r.status < 300) o.done(r.body || {});
        else if((r.status === 429 || r.status === 503 || r.status === 0) && tries < 8){ again.push(o); wait = Math.max(wait, parseInt((r.headers || {})["Retry-After"], 10) || 5); }
        else throw new Error((r.body && r.body.error && r.body.error.message) || ("HTTP " + r.status)); });
      chunk = again; tries++;
      if(chunk.length) await new Promise(r => setTimeout(r, wait * 1000));
    }
  }
}
// Owner-only full export, in the same columns as SharePoint's own CSV export, plus a link to each X-ray
const OWNER = "sar@sparshhospital.com";
function isOwner(){ return SP.on && !!SP.acct && String(SP.acct.username || "").toLowerCase() === OWNER; }
async function spExport(btn){
  if(!isOwner() || btn.disabled) return;
  const label = btn.textContent; btn.disabled = true;
  const cols = ["Title","Kind","UHID","FormType","FollowUp","Status","Updated","Payload"];
  const q = v => { const x = v == null ? "" : String(v); return /[",\r\n]/.test(x) ? '"' + x.replace(/"/g, '""') + '"' : x; };
  const rows = [cols.concat("XRays").join(",")];
  const xr = f => { if(f.Kind !== "Form") return ""; try{ return xrIds(JSON.parse(f.Payload)).map(id => xrUrl(f.UHID, id)).join(" "); }catch(e){ return ""; } };
  try{
    let url = "/sites/" + SP.siteId + "/lists/" + SP.listId + "/items?$expand=fields($select=" + cols.join(",") + ")&$select=id&$top=999";
    while(url){
      const j = await spFetch(url);
      (j.value || []).forEach(it => { const f = it.fields || {}; rows.push(cols.map(c => q(f[c])).concat(q(xr(f))).join(",")); });
      btn.textContent = "Exporting… " + (rows.length - 1);
      url = j["@odata.nextLink"];
    }
    const blob = new Blob(["\ufeff" + rows.join("\r\n")], { type:"text/csv;charset=utf-8" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "Registry Data " + todayStr() + ".csv";
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    btn.textContent = "Exported " + (rows.length - 1) + " rows ✓";
  }catch(e){ btn.textContent = "Export failed: " + e.message; }
  setTimeout(() => { btn.textContent = label; btn.disabled = false; }, 6000);
}
function spQueue(){ SP.dirty = true; spStatus("pending"); clearTimeout(SP.timer); SP.timer = setTimeout(spPush, 700); return true; }
async function spPush(){
  if(SP.busy){ SP.again = true; return; }
  SP.busy = true; SP.dirty = false; spStatus("saving");
  const base = "/sites/" + SP.siteId + "/lists/" + SP.listId + "/items";
  try{
    await xrUpload();
    const want = {};
    patients.forEach(p => { if(!p.sum || SP.fl.has(p.id)){ SP.fl.add(p.id); p.sum = summaryOf(p); } });
    patients.forEach(p => { want["P|" + p.id] = { kind:"Patient", title:p.id, uhid:p.id, ft:"", fu:0, st:p.status || "", s:JSON.stringify(p) }; });
    Object.keys(forms).forEach(k => { const r = forms[k]; want["F|" + k] = { kind:"Form", title:k, uhid:r.patientId || "", ft:r.formType || "", fu:r.followUp || 0, st:r.status || "", s:JSON.stringify(r) }; });
    const ops = [];
    for(const key of Object.keys(want)){
      const w = want[key], cur = SP.snap[key];
      if(cur && cur.s === w.s) continue;
      const fields = { Title:w.title, Kind:w.kind, UHID:w.uhid, FormType:w.ft, FollowUp:w.fu, Status:w.st, Updated:new Date().toISOString(), Payload:w.s };
      if(cur) ops.push({ method:"PATCH", url:base + "/" + cur.id + "/fields", body:fields, done:() => { cur.s = w.s; } });
      else ops.push({ method:"POST", url:base, body:{ fields:fields }, done:j => { SP.snap[key] = { id:j.id, s:w.s }; } });
    }
    const inScope = key => key[0] === "P" || SP.fl.has(key.slice(2).split("_")[0]);
    for(const key of Object.keys(SP.snap)){ if(!want[key] && inScope(key)) ops.push({ method:"DELETE", url:base + "/" + SP.snap[key].id, done:() => { delete SP.snap[key]; } }); }
    await spRun(ops);
    spStatus("saved");
  }catch(e){ SP.err = e.message; SP.dirty = true; spStatus("error"); clearTimeout(SP.timer); SP.timer = setTimeout(spPush, 20000); }
  SP.busy = false; if(SP.again){ SP.again = false; spQueue(); }
}
